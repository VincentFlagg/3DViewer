# Publishes a GitHub release when a version tag (v1.2.3) is pushed. The notes
# come from releases/<tag>.md; docker-compose.yml is attached.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          notes="releases/${TAG}.md"
          if [ ! -f "$notes" ]; then echo "Missing $notes"; exit 1; fi
          gh release create "$TAG" docker-compose.yml \
            --title "3D Viewer ${TAG#v}" \
            --notes-file "$notes" \
            --latest
